[General]
# Este archivo se deja como referencia/documentación de los valores que
# usa Main.qml. Actualmente Main.qml NO lee este archivo (para evitar
# depender de SddmComponents/ConfigReader, que causó los errores de la
# captura anterior); los valores están escritos directamente en el QML.
# Si más adelante quieres que Main.qml los lea de aquí en vez de tenerlos
# fijos, dímelo y agrego un ConfigReader.

panelWidthRatio=0.30
fontFamily=FiraCode
blurEnabled=true
blurAmount=1.0
wallpaperDir=wallpaper
