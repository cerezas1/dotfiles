[config]
source_color_index = 0

[templates.waybar]
input_path = "~/.config/matugen/templates/waybar-colors.css"
output_path = "~/.config/waybar/colors.css"
post_hook = "pkill waybar; sleep 0.3; waybar & disown"

[templates.hyprland]
input_path = "~/.config/matugen/templates/hyprland-colors.lua"
output_path = "~/.config/hypr/colors.lua"
post_hook = "hyprctl reload"

[templates.swaync]
input_path = "~/.config/matugen/templates/swaync.css"
output_path = "~/.config/swaync/themes/colors.css"
post_hook = "swaync-client -rs"
#[templates.niri]
#input_path = '~/.config/matugen/templates/niri-colors.kdl'
#output_path = '~/.config/niri/colors.kdl'
#post_hook = 'niri msg action load-config-file'

[templates.cava]
input_path = "~/.config/matugen/templates/cava-colors.txt"
output_path = "~/.config/cava/config"
post_hook = "pkill -SIGUSR1 cava"
